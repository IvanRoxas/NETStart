<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowMaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10ac84" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#18072c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mazeNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dd1a1"/>
      <stop offset="100%" stop-color="#10ac84"/>
    </linearGradient>
    <filter id="mazeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ambient Glow & Shield Ring -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGlowMaze)"/>
  <circle cx="100" cy="100" r="86" fill="#0c051f" stroke="#1dd1a1" stroke-width="2.5" stroke-dasharray="10 4" opacity="0.85"/>
  <circle cx="100" cy="100" r="76" fill="#130829" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- High-Tech Cyber Labyrinth Structure -->
  <g stroke="url(#mazeNeon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#mazeGlow)" fill="none">
    <!-- Outer Maze Walls -->
    <path d="M 50 50 L 150 50 L 150 150 L 50 150 Z" stroke-opacity="0.35" stroke-width="2"/>
    
    <!-- Labyrinth Corridors -->
    <path d="M 50 80 L 100 80 L 100 65"/>
    <path d="M 120 50 L 120 100 L 150 100"/>
    <path d="M 80 100 L 80 130 L 120 130"/>
    <path d="M 100 130 L 100 150"/>
    <path d="M 50 120 L 65 120"/>
    <path d="M 135 120 L 135 150"/>
  </g>

  <!-- Glowing Solved Path Route -->
  <path d="M 50 65 L 75 65 L 75 100 L 100 100 L 100 115 L 120 115 L 120 80 L 150 80" 
        fill="none" 
        stroke="#feca57" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-dasharray="4 2"
        filter="url(#mazeGlow)"
  />

  <!-- Hazard Nodes / Warning Spikes -->
  <circle cx="90" cy="65" r="5" fill="#ff4757" stroke="#ffffff" stroke-width="1.5" filter="url(#mazeGlow)"/>
  <circle cx="135" cy="115" r="5" fill="#ff4757" stroke="#ffffff" stroke-width="1.5" filter="url(#mazeGlow)"/>
  <circle cx="65" cy="135" r="5" fill="#ff4757" stroke="#ffffff" stroke-width="1.5" filter="url(#mazeGlow)"/>

  <!-- Core Terminal Destination Beacon -->
  <g transform="translate(150, 80)" filter="url(#mazeGlow)">
    <circle cx="0" cy="0" r="7" fill="#1dd1a1" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
