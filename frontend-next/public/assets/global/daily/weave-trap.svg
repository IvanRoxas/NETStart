<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4757" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#18072c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#ff4757"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="50%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#ffa502"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ambient Glow & Shield Ring -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)"/>
  <circle cx="100" cy="100" r="86" fill="#120524" stroke="#ff4757" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85"/>
  <circle cx="100" cy="100" r="76" fill="#1a0833" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Cyber Grid Matrix -->
  <g opacity="0.25" stroke="#ff6b81" stroke-width="1.5">
    <line x1="45" y1="45" x2="155" y2="45"/>
    <line x1="45" y1="80" x2="155" y2="80"/>
    <line x1="45" y1="120" x2="155" y2="120"/>
    <line x1="45" y1="155" x2="155" y2="155"/>
    <line x1="45" y1="45" x2="45" y2="155"/>
    <line x1="80" y1="45" x2="80" y2="155"/>
    <line x1="120" y1="45" x2="120" y2="155"/>
    <line x1="155" y1="45" x2="155" y2="155"/>
  </g>

  <!-- Red Hazard Mines / Bombs -->
  <g filter="url(#neonGlow)">
    <!-- Top Bomb -->
    <circle cx="120" cy="65" r="11" fill="#ff4757"/>
    <circle cx="120" cy="65" r="6" fill="#2f3542"/>
    <circle cx="120" cy="65" r="2.5" fill="#ff6b81"/>
    <line x1="120" y1="49" x2="120" y2="81" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
    <line x1="104" y1="65" x2="136" y2="65" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>

    <!-- Middle Bomb -->
    <circle cx="75" cy="100" r="12" fill="#ff4757"/>
    <circle cx="75" cy="100" r="6.5" fill="#2f3542"/>
    <circle cx="75" cy="100" r="3" fill="#ff6b81"/>
    <line x1="75" y1="83" x2="75" y2="117" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="100" x2="92" y2="100" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Weaving Navigation S-Route (Green to Orange Path) -->
  <path d="M 40 100 Q 55 140 100 140 T 140 100 Q 155 75 162 70" 
        fill="none" 
        stroke="url(#pathGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"
  />

  <!-- Rover Indicator on Path -->
  <circle cx="40" cy="100" r="7" fill="#2ed573" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)"/>
  
  <!-- Extraction Goal Pod Target -->
  <g transform="translate(155, 65)">
    <polygon points="0,-10 9,6 -9,6" fill="#ffa502" stroke="#ffffff" stroke-width="1.5" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
